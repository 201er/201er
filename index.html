
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f2e8">

  <title>Your Digital Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f2e8;
      color: #68482f;
      font-family: Georgia, serif;
      text-align: center;
    }

    header {
      padding: 24px 12px 8px;
    }

    h1 {
      font-size: clamp(25px, 5vw, 38px);
      margin: 0 0 10px;
    }

    header p {
      margin: 0 0 12px;
      font-size: 15px;
    }

    #status {
      padding: 14px 12px;
      font: 14px Arial, sans-serif;
      line-height: 1.6;
    }

    #book-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #book {
      margin: 0 auto;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 10px;
      font: 14px Arial, sans-serif;
    }

    button {
      background: #815c3b;
      color: white;
      border: 0;
      border-radius: 24px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    footer {
      padding: 12px 10px 24px;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <h1>You're Invited! 💌</h1>
    <p>Turn the pages to discover your invitation</p>
  </header>

  <div id="status" role="status" aria-live="polite">
    Loading invitation...
  </div>

  <div id="book-container" class="hidden">
    <div id="book"></div>
  </div>

  <div id="controls" class="controls hidden">
    <button id="prev" type="button" disabled>
      ← Previous
    </button>

    <span id="page-number">Page 1</span>

    <button id="next" type="button" disabled>
      Next →
    </button>
  </div>

  <footer>
    We look forward to celebrating with you! ❤️
  </footer>

  <!-- PDF.js renders PDF pages in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- StPageFlip provides the page-turn animation -->
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script>
    const status = document.getElementById("status");
    const bookContainer = document.getElementById("book-container");
    const controls = document.getElementById("controls");

    // Read the guest ID from the URL.
    // Example: https://fedcba499.github.io/?guest=swamy
    const params = new URLSearchParams(window.location.search);
    const guestId = params.get("guest");

    // Only allow simple filename characters.
    // This prevents arbitrary paths from being supplied in the URL.
    const validGuestId =
      guestId &&
      /^[a-zA-Z0-9_-]+$/.test(guestId);

    // PDFs are stored in the "invites" folder.
    const pdfUrl = validGuestId
      ? `./invites/${guestId}.pdf`
      : null;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    async function startInvitation() {
      try {
        // Check the URL.
        if (!pdfUrl) {
          status.textContent =
            "Invitation not found. Please check the link you received.";
          return;
        }

        // Check whether the requested PDF exists.
        status.textContent = "Loading your invitation...";

        const response = await fetch(pdfUrl);

        if (!response.ok) {
          status.textContent =
            "Invitation not found. Please check your link or contact the host.";
          return;
        }

        // Read the PDF.
        const pdfData = await response.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
          data: pdfData
        }).promise;

        if (pdf.numPages === 0) {
          throw new Error("The PDF has no pages.");
        }

        const pageImages = [];

        let pageWidth = 500;
        let pageHeight = 700;

        // Render each PDF page as an image.
        for (let i = 1; i <= pdf.numPages; i++) {
          status.textContent =
            `Preparing your invitation: page ${i} of ${pdf.numPages}...`;

          const page = await pdf.getPage(i);

          const originalViewport =
            page.getViewport({ scale: 1 });

          // Limit rendering dimensions for performance.
          const scale = Math.min(
            1000 / originalViewport.width,
            1400 / originalViewport.height
          );

          const viewport = page.getViewport({ scale });

          pageWidth = Math.round(viewport.width);
          pageHeight = Math.round(viewport.height);

          const canvas = document.createElement("canvas");

          canvas.width = pageWidth;
          canvas.height = pageHeight;

          const context = canvas.getContext("2d");

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          pageImages.push(
            canvas.toDataURL("image/jpeg", 0.92)
          );

          // Release the PDF page resources after rendering.
          page.cleanup();
        }

        // Create the interactive flipbook.
        const flipbook = new St.PageFlip(
          document.getElementById("book"),
          {
            width: pageWidth,
            height: pageHeight,
            size: "stretch",
            minWidth: 280,
            maxWidth: 1000,
            minHeight: 350,
            maxHeight: 1400,
            autoSize: true,
            showCover: true,
            usePortrait: true,
            drawShadow: true,
            maxShadowOpacity: 0.4,
            flippingTime: 900,
            mobileScrollSupport: false
          }
        );

        flipbook.loadFromImages(pageImages);

        // Show the flipbook after the PDF has loaded.
        bookContainer.classList.remove("hidden");
        controls.classList.remove("hidden");

        function updateControls() {
          const currentPage =
            flipbook.getCurrentPageIndex();

          const totalPages =
            flipbook.getPageCount();

          document.getElementById("page-number").textContent =
            `Page ${currentPage + 1} of ${totalPages}`;

          document.getElementById("prev").disabled =
            currentPage <= 0;

          document.getElementById("next").disabled =
            currentPage >= totalPages - 1;
        }

        flipbook.on("flip", updateControls);

        document.getElementById("prev").onclick = function () {
          flipbook.flipPrev();
        };

        document.getElementById("next").onclick = function () {
          flipbook.flipNext();
        };

        updateControls();

        status.textContent =
          "Your invitation is ready. Tap, swipe or turn the pages.";

      } catch (error) {
        console.error("Invitation loading error:", error);

        status.textContent =
          "Unable to display this invitation. Please check that the PDF is valid and try again.";
      }
    }

    // Check that the external libraries loaded successfully.
    if (typeof pdfjsLib === "undefined") {
      status.textContent =
        "Unable to load the PDF viewer. Please check your internet connection and refresh.";
    } else if (typeof St === "undefined" || !St.PageFlip) {
      status.textContent =
        "Unable to load the page-flip animation. Please refresh and try again.";
    } else {
      startInvitation();
    }
  </script>
</body>
</html>
