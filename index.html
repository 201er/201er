<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f2e8">

  <title>DIAMOND JUBILEE CELEBRATIONS</title>
  <link rel="icon" type="image/png" href="./djc_logo.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f2e8;
      color: #68482f;
      font-family: Georgia, serif;
      text-align: center;
    }

    header {
      padding: 24px 12px 8px;
    }

    .site-logo {
      display: block;
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin: 0 auto 14px;
    }

    h1 {
      font-size: clamp(23px, 5vw, 38px);
      margin: 0 0 10px;
    }

    header p {
      margin: 0 0 12px;
      font-size: 15px;
    }

    #status {
      padding: 14px 12px;
      font: 14px Arial, sans-serif;
      line-height: 1.6;
    }

    #book-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px;
      overflow: auto;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    #book {
      margin: 0 auto;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 10px;
      font: 14px Arial, sans-serif;
    }

    button {
      background: #815c3b;
      color: white;
      border: 0;
      border-radius: 24px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 3px solid #c39a66;
      outline-offset: 3px;
    }

    #page-number {
      min-width: 100px;
    }

    #zoom-level {
      min-width: 48px;
      font-weight: bold;
    }

    footer {
      padding: 12px 10px 24px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      header {
        padding-top: 16px;
      }

      .site-logo {
        width: 78px;
        height: 78px;
      }

      .controls {
        gap: 8px;
      }

      button {
        padding: 10px 13px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <header>
    <img
      src="./djc_logo.png"
      alt="DJC Logo"
      class="site-logo"
    >

    <h1>DIAMOND JUBILEE CELEBRATIONS</h1>
    <p>ERUNOOTRU ONNE EPPOTHUM MUNNE</p>
  </header>

  <div id="status" role="status" aria-live="polite">
    Loading invitation...
  </div>

  <div id="book-container" class="hidden">
    <div id="book"></div>
  </div>

  <div id="controls" class="controls hidden">
    <button id="prev" type="button" disabled>
      ← Previous
    </button>

    <span id="page-number">Page 1</span>

    <button id="next" type="button" disabled>
      Next →
    </button>

    <button id="zoom-out" type="button" disabled
      aria-label="Zoom out">
      −
    </button>

    <span id="zoom-level">100%</span>

    <button id="zoom-in" type="button" disabled
      aria-label="Zoom in">
      +
    </button>

    <button id="zoom-reset" type="button" disabled>
      Reset Zoom
    </button>
  </div>

  <footer>
    We look forward to celebrating with you! ❤️
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script>
    const status = document.getElementById("status");
    const bookContainer = document.getElementById("book-container");
    const bookElement = document.getElementById("book");
    const controls = document.getElementById("controls");

    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");
    const zoomInButton = document.getElementById("zoom-in");
    const zoomOutButton = document.getElementById("zoom-out");
    const zoomResetButton = document.getElementById("zoom-reset");
    const zoomLevelLabel = document.getElementById("zoom-level");
    const pageNumberLabel = document.getElementById("page-number");

    // Example:
    // https://fedcba499.github.io/?guest=swamy

    const params = new URLSearchParams(window.location.search);
    const guestId = params.get("guest");

    const validGuestId =
      guestId && /^[a-zA-Z0-9_-]+$/.test(guestId);

    const pdfUrl = validGuestId
      ? `./invites/${guestId}.pdf`
      : null;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let flipbook = null;
    let zoomLevel = 1;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 1.5;
    const ZOOM_STEP = 0.1;

    function updateZoom() {
      // CSS zoom changes the displayed size and layout.
      // Rendering at high resolution first helps retain detail.
      bookElement.style.zoom = String(zoomLevel);

      zoomLevelLabel.textContent =
        `${Math.round(zoomLevel * 100)}%`;

      zoomOutButton.disabled = zoomLevel <= MIN_ZOOM;
      zoomInButton.disabled = zoomLevel >= MAX_ZOOM;
      zoomResetButton.disabled = zoomLevel === MIN_ZOOM;
    }

    zoomInButton.addEventListener("click", () => {
      zoomLevel = Math.min(
        MAX_ZOOM,
        Math.round((zoomLevel + ZOOM_STEP) * 10) / 10
      );

      updateZoom();
    });

    zoomOutButton.addEventListener("click", () => {
      zoomLevel = Math.max(
        MIN_ZOOM,
        Math.round((zoomLevel - ZOOM_STEP) * 10) / 10
      );

      updateZoom();
    });

    zoomResetButton.addEventListener("click", () => {
      zoomLevel = MIN_ZOOM;
      updateZoom();

      bookContainer.scrollTo({
        top: 0,
        left: 0,
        behavior: "smooth"
      });
    });

    function updateControls() {
      if (!flipbook) return;

      const currentPage = flipbook.getCurrentPageIndex();
      const totalPages = flipbook.getPageCount();

      pageNumberLabel.textContent =
        `Page ${currentPage + 1} of ${totalPages}`;

      prevButton.disabled = currentPage <= 0;
      nextButton.disabled = currentPage >= totalPages - 1;
    }

    async function renderPdfPage(page, pageNumber) {
      const originalViewport = page.getViewport({ scale: 1 });

      // Render each page at high resolution, with a limit
      // to prevent excessively large canvas dimensions.
      const renderScale = Math.min(
        3,
        1800 / originalViewport.width,
        2400 / originalViewport.height
      );

      const viewport = page.getViewport({
        scale: renderScale
      });

      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);

      const context = canvas.getContext("2d", {
        alpha: false
      });

      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, canvas.width, canvas.height);

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;

      // PNG avoids JPEG compression artifacts around text.
      const imageUrl = canvas.toDataURL("image/png");

      // Release the temporary canvas backing store.
      canvas.width = 0;
      canvas.height = 0;

      return {
        imageUrl,
        width: Math.ceil(viewport.width),
        height: Math.ceil(viewport.height)
      };
    }

    async function startInvitation() {
      try {
        if (!pdfUrl) {
          status.textContent =
            "Invitation not found. Please check the link you received.";
          return;
        }

        status.textContent = "Loading your invitation...";

        const response = await fetch(pdfUrl);

        if (!response.ok) {
          status.textContent =
            "Invitation not found. Please check your link or contact the host.";
          return;
        }

        const pdfData = await response.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
          data: pdfData
        }).promise;

        if (pdf.numPages === 0) {
          throw new Error("The PDF has no pages.");
        }

        const pageImages = [];

        let pageWidth = 0;
        let pageHeight = 0;

        for (let i = 1; i <= pdf.numPages; i++) {
          status.textContent =
            `Preparing your invitation: page ${i} of ${pdf.numPages}...`;

          const page = await pdf.getPage(i);
          const rendered = await renderPdfPage(page, i);

          if (i === 1) {
            pageWidth = rendered.width;
            pageHeight = rendered.height;
          }

          pageImages.push(rendered.imageUrl);

          page.cleanup();
        }

        flipbook = new St.PageFlip(bookElement, {
          width: pageWidth,
          height: pageHeight,
          size: "stretch",
          minWidth: 280,
          maxWidth: 1000,
          minHeight: 350,
          maxHeight: 1400,
          autoSize: true,
          showCover: true,
          usePortrait: true,
          drawShadow: true,
          maxShadowOpacity: 0.4,
          flippingTime: 900,
          mobileScrollSupport: false
        });

        flipbook.loadFromImages(pageImages);

        bookContainer.classList.remove("hidden");
        controls.classList.remove("hidden");

        flipbook.on("flip", updateControls);

        // Use the same flipbook API and corner setting
        // for both directions.
        prevButton.addEventListener("click", () => {
          if (flipbook) flipbook.flipPrev("top");
        });

        nextButton.addEventListener("click", () => {
          if (flipbook) flipbook.flipNext("top");
        });

        zoomLevel = 1;
        updateZoom();
        updateControls();

        status.textContent =
          "Your invitation is ready. Tap, swipe or turn the pages.";

      } catch (error) {
        console.error("Invitation loading error:", error);

        status.textContent =
          "Unable to display this invitation. Please check that the PDF is valid and try again.";
      }
    }

    if (typeof pdfjsLib === "undefined") {
      status.textContent =
        "Unable to load the PDF viewer. Please check your internet connection and refresh.";
    } else if (typeof St === "undefined" || !St.PageFlip) {
      status.textContent =
        "Unable to load the page-flip animation. Please refresh and try again.";
    } else {
      startInvitation();
    }
  </script>
</body>
</html>
